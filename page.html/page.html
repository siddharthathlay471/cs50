<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Record Finder</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="container">
    <h1>Student Record Finder</h1>

    <form id="student-search" class="card">
      <input type="text" name="student" id="studentCode" placeholder="Enter student ID (e.g. STU101)" autofocus>
      <button type="submit" id="submit-button">Find record</button>
    </form>

    <div id="result" class="result-card hidden"></div>
  </div>

  <script src="script.js"></script>
</body>
</html>
